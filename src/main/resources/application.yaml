spring:
  application:
    name: ticketing
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/ticketing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

mybatis:
  type-handlers-package: com.ticketing.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-match: /api/**

ticketing:
  demo-password: ${DEMO_PASSWORD:}
  payment-recovery:
    enabled: ${PAYMENT_RECOVERY_ENABLED:true}
    fixed-delay-ms: ${PAYMENT_RECOVERY_FIXED_DELAY_MS:1000}
    batch-size: ${PAYMENT_RECOVERY_BATCH_SIZE:50}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
