name: ticketing

x-mysql: &mysql
  image: mysql:8.4.11
  command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
        --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --batch --skip-column-names --execute="SELECT 1"
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  mysql:
    <<: *mysql
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/start-infra.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/start-infra.ps1 first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mysql-test:
    <<: *mysql
    profiles: [test]
    environment:
      MYSQL_DATABASE: ticketing_test
      MYSQL_USER: ticketing_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Run scripts/start-infra.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Run scripts/start-infra.ps1 first}
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-3308}:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql

volumes:
  mysql-data:
  mysql-test-data:
